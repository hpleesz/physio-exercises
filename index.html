<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #EAF0F1; --surface: #FFFFFF; --ink: #17262C; --muted: #56676E;
      --line: #CFDADD; --accent: #1D6A72; --accent-soft: #D3E7E8; --note: #FFF4D6;
      --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121B1E; --surface: #1A2629; --ink: #E4EDEE; --muted: #9AACB1;
        --line: #2C3C40; --accent: #6FC3CA; --accent-soft: #23393C; --note: #3A3420;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 var(--font); }
    main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 0.25rem; }
    .lede { color: var(--muted); margin: 0 0 1.75rem; }

    .search {
      width: 100%; font: inherit; font-size: 1.375rem; padding: 0.9rem 1.1rem;
      border: 2px solid var(--line); border-radius: 0.75rem; background: var(--surface); color: var(--ink);
    }
    .search:focus { outline: none; border-color: var(--accent); }

    .filter { margin-top: 1rem; }
    .filter-label { font-size: 0.875rem; color: var(--muted); margin-bottom: 0.35rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      font: inherit; font-size: 0.9375rem; cursor: pointer; padding: 0.3rem 0.8rem;
      border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink);
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .chip:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .count { color: var(--muted); font-size: 0.9375rem; margin: 1.5rem 0 0.5rem; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    summary {
      list-style: none; cursor: pointer; padding: 0.9rem 0.25rem;
      display: grid; grid-template-columns: 2.75rem 1fr auto; align-items: baseline; gap: 0.75rem;
    }
    summary::-webkit-details-marker { display: none; }
    .num { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    .name { font-weight: 700; font-size: 1.125rem; }
    .part { color: var(--muted); font-size: 0.9375rem; text-align: right; }
    .body { padding: 0 0.25rem 1.2rem 3.5rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .tag { background: var(--accent-soft); border-radius: 0.375rem; padding: 0.1rem 0.5rem; font-size: 0.875rem; }
    .comment { background: var(--note); border-radius: 0.5rem; padding: 0.5rem 0.75rem; margin: 0 0 0.75rem; }
    .body p { margin: 0 0 0.6rem; max-width: 65ch; }
    .source { color: var(--muted); font-size: 0.9375rem; }
    .body img { max-width: 100%; border-radius: 0.5rem; margin-bottom: 0.75rem; }
    .empty { padding: 2rem 0; color: var(--muted); }
    @media (max-width: 30rem) {
      summary { grid-template-columns: 2.25rem 1fr; }
      .part { grid-column: 2; text-align: left; }
      .body { padding-left: 0.25rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Exercise library</h1>
    <p class="lede">Search by number, name, body part, equipment, source or anything in the instructions.</p>

    <input class="search" id="q" type="search" placeholder="Try “knee band” or “12”" aria-label="Search exercises" autocomplete="off">
    <div id="filters"></div>

    <p class="count" id="count" aria-live="polite">Loading exercises…</p>
    <ul id="list"></ul>
  </main>

  <script>
    // Paste your values from Supabase: Project Settings > API
    const SUPABASE_URL = "https://uvbrkotsytciplajbomh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-pDh2Sx3Ewt0OgOfkoPfpQ_ROhg8rcE"; // safe to expose; RLS makes it read-only

    // Which array columns get filter buttons
    const FILTERS = [
      { key: "body_part", label: "Body part" },
      { key: "area", label: "Area" },
    ];

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    const arr = (v) => Array.isArray(v) ? v : [];
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let all = [];
    const active = {}; // e.g. { body_part: "Knee", area: null }

    function matches(ex, words) {
      for (const f of FILTERS) {
        if (active[f.key] && !arr(ex[f.key]).includes(active[f.key])) return false;
      }
      const hay = [
        ex.number, ex.name, ...arr(ex.region), ...arr(ex.body_part), ...arr(ex.type),
        ...arr(ex.equipment), ...arr(ex.area), ex.source, ex.comment, ex.instructions,
      ].join(" ").toLowerCase();
      return words.every((w) => hay.includes(w));
    }

    function render() {
      const words = $("q").value.trim().toLowerCase().replace(/#/g, "").split(/\s+/).filter(Boolean);
      const hits = all.filter((ex) => matches(ex, words));

      $("count").textContent = `${hits.length} of ${all.length} exercises`;
      $("list").innerHTML = hits.length ? hits.map((ex) => {
        const tags = [...arr(ex.region), ...arr(ex.type), ...arr(ex.equipment), ...arr(ex.area)];
        return `
        <li><details>
          <summary>
            <span class="num">${ex.number ?? ""}</span>
            <span class="name">${esc(ex.name)}</span>
            <span class="part">${esc(arr(ex.body_part).join(", "))}</span>
          </summary>
          <div class="body">
            ${tags.length ? `<div class="meta">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
            ${ex.comment ? `<p class="comment">${esc(ex.comment)}</p>` : ""}
            ${ex.image_url ? `<img src="${esc(ex.image_url)}" alt="${esc(ex.name)}" loading="lazy">` : ""}
            ${ex.instructions ? `<p>${esc(ex.instructions)}</p>` : ""}
            ${ex.source ? `<p class="source">Source: ${esc(ex.source)}</p>` : ""}
          </div>
        </details></li>`;
      }).join("")
      : `<li class="empty">No exercises match. Try fewer words or clear a filter.</li>`;
    }

    function renderFilters() {
      $("filters").innerHTML = FILTERS.map((f) => {
        const values = [...new Set(all.flatMap((e) => arr(e[f.key])))].sort();
        if (!values.length) return "";
        const btn = (v, label, on) =>
          `<button class="chip" data-key="${f.key}" data-value="${esc(v)}" aria-pressed="${on}">${esc(label)}</button>`;
        return `<div class="filter" role="group" aria-label="Filter by ${f.label.toLowerCase()}">
          <div class="filter-label">${f.label}</div>
          <div class="chips">${btn("", "All", !active[f.key])}${values.map((v) => btn(v, v, active[f.key] === v)).join("")}</div>
        </div>`;
      }).join("");
    }

    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      active[b.dataset.key] = b.dataset.value || null;
      renderFilters(); render();
    });
    $("q").addEventListener("input", render);

    (async () => {
      const { data, error } = await db.from("exercises").select("*")
        .order("number", { ascending: true, nullsFirst: false }).order("name");
      if (error) {
        $("count").textContent = `Couldn't load exercises: ${error.message}. Check the URL and key near the bottom of index.html.`;
        return;
      }
      all = data;
      renderFilters(); render();
    })();
  </script>
</body>
</html>
